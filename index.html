<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejercicios con Vectores Numericos</title>
<style>
table td {
    text-align: center;
}
</style>
</head>
<body>
<h4>Ejercicio con Vectores</h4>
<div>
<table>
<tbody>
<tr>
    <td>Dimension del arreglo:</td>
    <td>
        <!-- Select Dimension: elige el tamaño del vector -->
        <select id="select-dimension-arreglo">
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="20">20</option>
            <option value="25">25</option>
            <option value="30">30</option>
        </select>
    </td>
</tr>
<tr>
    <td>Ingrese valor a buscar:</td>
    <td>
        <!-- Input Buscar: aquí se escribe el valor a buscar en el vector -->
        <input type="text" name="" id="id-txt-buscar" maxlength="4" size="5">
    </td>
</tr>
</tbody>
</table>
</div>
<br>
<table id="id-table-vector-numerico" border="1" cellspacing="1" cellpadding="1">
<thead>
<tr>
    <td colspan="10">Vector numerico de N elementos</td>
</tr>
</thead>
<tbody id="id-body-vector">
<!-- CAMBIO 1: tbody vacío con id. El JS pinta las 2 filas con for -->
</tbody>
<tfoot>
<tr>
    <!-- Botón Cargar Vector: genera números aleatorios en el vector -->
    <td colspan="5"><button id="btn-cargar-vector">Cargar Vector</button></td>
    <!-- Botón Vaciar Vector: limpia el vector y deja ceros en la tabla -->
    <td colspan="5"><button id="btn-vaciar-vector">Vaciar Vector</button></td>
</tr>
<tr>
    <!-- Botón Presentar Vector: muestra en tabla los valores del vector -->
    <td colspan="10" align="center"><button id="btn-presentar-vector">Presentar Vector</button></td>
</tr>
<tr>
    <!-- Botón Número Mayor: busca el valor más alto del vector -->
    <td colspan="5"><button id="btn-numero-mayor">Numero Mayor</button></td>
    <!-- Botón Número Menor: busca el valor más bajo del vector -->
    <td colspan="5"><button id="btn-numero-menor">Numero Menor</button></td>
</tr>
<tr>
    <!-- Botón Suma de Valores: suma todos los elementos del vector -->
    <td colspan="5"><button id="btn-sumar-valores">Suma de Valores</button></td>
    <!-- Botón Producto de Valores: multiplica todos los elementos del vector -->
    <td colspan="5"><button id="btn-producto-vector">Producto de Valores</button></td>
</tr>
<tr>
    <!-- Botón Moda: encuentra el número que más se repite -->
    <td colspan="3"><button id="btn-calcular-moda">Moda</button></td>
    <!-- Botón Media: calcula el promedio del vector -->
    <td colspan="3"><button id="btn-calcular-media">Media</button></td>
    <!-- Botón Mediana: calcula el valor del centro del vector ordenado -->
    <td colspan="4"><button id="btn-calcular-mediana">Mediana</button></td>
</tr>
<tr>
    <!-- Botón Orden Selección: ordena el vector de menor a mayor -->
    <td colspan="5"><button id="btn-orden-seleccion">Orden Selección</button></td>
    <td colspan="2">
        <!-- Select Orden: elige si ordenar ascendente o descendente -->
        <select id="select-tipo-orden">
            <option value="ASC">ASC</option>
            <option value="DESC">DESC</option>
        </select>
    </td>
    <!-- Botón Orden Burbuja: ordena el vector según ASC o DESC -->
    <td colspan="3"><button id="btn-orden-burbuja">Orden Burbuja</button></td>
</tr>
<tr>
    <!-- Botón Buscar Valor: busca si el valor existe en el vector -->
    <td colspan="5"><button id="btn-buscar-valor">Buscar Valor</button></td>
</tr>
</tfoot>
</table>
<hr>
<table>
<thead>
<tr>
    <td colspan="2">Calculos con vectores </td>
</tr>
</thead>
<tbody>
<tr>
    <td>Resultado:</td>
    <td colspan="2"><input type="text" id="id-txt-respuesta" size="70"></td>
</tr>
<tr>
    <td>Resultado Búsqueda:</td>
    <td colspan="2" id="lbl-resultado"></td>
</tr>
</tbody>
</table>

<script src="js/app.js"></script>
</body>
</html>
