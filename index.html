<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ejercicios con Vectores Numericos</title>
<style>
table td {
    text-align: center;
}
</style>
</head>
<body>
<h4>Ejercicio con Vectores</h4>
<div>
<table>
<tbody>
<tr>
    <td>Dimension del arreglo:</td>
    <td>
        <select id="select-dimension-arreglo">
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="20">20</option>
            <option value="25">25</option>
            <option value="30">30</option>
        </select>
    </td>
</tr>
<tr>
    <td>Ingrese valor a buscar:</td>
    <td><input type="text" name="" id="id-valor-busqueda" maxlength="4" size="5"></td>
</tr>
</tbody>
</table>
</div>
<br>
<table id="id-table-vector-numerico" border="1" cellspacing="1" cellpadding="1">
<thead>
<tr>
    <td colspan="10">Vector numerico de N elementos</td>
</tr>
</thead>
<tbody>
<tr>
    <td></td><td></td><td></td><td></td><td></td>
    <td></td><td></td><td></td><td></td><td></td>
</tr>
<tr>
    <td>0</td><td>0</td><td>0</td><td>0</td><td>0</td>
    <td>0</td><td>0</td><td>0</td><td>0</td><td>0</td>
</tr>
</tbody>
<tfoot>
<tr>
    <!-- Genera números aleatorios según la dimensión elegida -->
    <td colspan="5"><button id="btn-cargar-vector">Cargar Vector</button></td>
    <!-- Reinicia el vector poniendo todos en 0 -->
    <td colspan="5"><button id="btn-vaciar-vector">Vaciar Vector</button></td>
</tr>
<tr>
    <!-- Busca el valor más alto del vector -->
    <td colspan="5"><button id="btn-numero-mayor">Numero Mayor</button></td>
    <!-- Busca el valor más bajo del vector -->
    <td colspan="5"><button id="btn-numero-menor">Numero Menor</button></td>
</tr>
<tr>
    <!-- Suma todos los elementos del vector -->
    <td colspan="5"><button id="btn-sumar-valores">Suma de Valores</button></td>
    <!-- Multiplica todos los elementos del vector -->
    <td colspan="5"><button id="btn-producto-vector">Producto de Valores</button></td>
</tr>
<tr>
    <!-- Calcula el valor que más se repite -->
    <td colspan="3"><button id="btn-calcular-moda">Moda</button></td>
    <!-- Calcula el promedio de todos los valores -->
    <td colspan="3"><button id="btn-calcular-media">Media</button></td>
    <!-- Calcula el valor del medio del vector ordenado -->
    <td colspan="4"><button id="btn-calcular-mediana">Mediana</button></td>
</tr>
<!-- ESTO ES LO QUE FALTABA -->
<tr>
    <!-- Ordena el vector usando algoritmo de selección -->
    <td colspan="5"><button id="btn-orden-seleccion">Orden Selección</button></td>
    <td colspan="2">
        <select id="select-tipo-orden">
            <option value="ASC">ASC</option>
            <option value="DESC">DESC</option>
        </select>
    </td>
    <!-- Ordena el vector usando algoritmo burbuja -->
    <td colspan="3"><button id="btn-orden-burbuja">Orden Burbuja</button></td>
</tr>
</tfoot>
</table>
<hr>
<table>
<thead>
<tr>
    <td colspan="2">Calculos con vectores </td>
</tr>
</thead>
<tbody>
<tr>
    <td>Resultado:</td>
    <td colspan="2"><input type="text" id="id-txt-respuesta" size="70"></td>
</tr>
</tbody>
</table>

<script src="js/app.js"></script>
</body>
</html>
